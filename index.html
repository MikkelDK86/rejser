<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><title>Travel Pokédex</title>
<style>
:root{--bg:#f5f2ec;--paper:#fbfaf7;--ink:#17252a;--muted:#758084;--line:#ddd8cf;--accent:#c86e52;--nav:#faf9f6ee;--shadow:0 10px 35px rgba(23,37,42,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:860px;margin:auto;min-height:100vh;padding-bottom:90px;background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.view{display:none}.view.active{display:block}.serif{font-family:Georgia,"Times New Roman",serif}.top{padding:22px 20px 10px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:.25em;text-transform:uppercase}.icon{font-size:22px}.hero{padding:8px 20px 22px}.heroImage{height:320px;border-radius:24px;background:url('assets/vegas.svg') center/cover;position:relative;overflow:hidden}.heroText{position:absolute;left:32px;right:32px;bottom:28px;max-width:440px;color:white;text-shadow:0 2px 12px #0008}.heroText small{opacity:.85}.heroText h1{font:48px Georgia,serif;line-height:1.02;margin:4px 0 6px}.heroText p{margin:0;font-size:15px;opacity:.9}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 20px}.metric{padding:14px 5px;text-align:center;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{display:block;font:22px Georgia,serif}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.section{padding:14px 20px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:4px 0 12px}.sectionTitle h2{font:24px Georgia,serif;margin:0}.small{font-size:12px;color:var(--muted)}.journeyCard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:12px;box-shadow:var(--shadow);margin-bottom:10px}.thumb{width:76px;height:76px;border-radius:14px;object-fit:cover;background:#ddd}.grow{flex:1;min-width:0}.journeyCard h3{margin:3px 0 4px;font-size:17px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;padding:5px 8px;border-radius:99px;background:#ecefe9;color:#53615e}.timeline{padding:0 20px 10px}.year{font:30px Georgia,serif;margin:20px 0 8px;display:flex;align-items:center;gap:10px}.year:after{content:"";height:1px;background:var(--line);flex:1}.timelineItem{display:grid;grid-template-columns:48px 12px 1fr;gap:10px;min-height:104px}.timelineDate{font:13px Georgia,serif;color:var(--muted);padding-top:4px}.timelineDot{position:relative}.timelineDot:before{content:"";position:absolute;top:8px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}.timelineDot:after{content:"";position:absolute;top:20px;bottom:0;left:5px;width:1px;background:var(--line)}.timelineItem:last-child .timelineDot:after{display:none}.mapbox{height:410px;margin:8px 20px;border-radius:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dce5de,#e8e4da 48%,#cbd7d1);box-shadow:var(--shadow)}.mapbox:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 30% 35%,#fff8 0 1px,transparent 2px),radial-gradient(circle at 70% 55%,#fff7 0 1px,transparent 2px);background-size:42px 42px;opacity:.55}.mapLabel{position:absolute;background:#fffdf9e8;padding:8px 11px;border-radius:12px;font-size:11px;box-shadow:0 4px 12px #0001}.detailHero{height:330px;background:url('assets/vegas2.svg') center/cover;position:relative;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#08171bca);pointer-events:none}.detailHero>*{position:relative;z-index:1}.detailHero .title{position:absolute;bottom:24px;left:20px}.detailHero h1{font:42px Georgia,serif;margin:0}.detailHero p{margin:5px 0 0;opacity:.85}.detailBody{padding:0 20px}.quote{font:italic 16px Georgia,serif;line-height:1.5;margin:18px 0}.detailMetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dmetric{padding:11px 6px;background:var(--paper);border:1px solid var(--line);border-radius:14px;text-align:center}.dmetric b{display:block;font-size:15px}.dmetric span{font-size:9px;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;padding:16px 0 8px}.tab{padding:8px 12px;border-radius:99px;background:#e8e9e4;color:#53615e;font-size:11px;white-space:nowrap}.tab.active{background:var(--ink);color:white}.mediaGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mediaGrid img{width:100%;height:145px;object-fit:cover;border-radius:14px;background:#ddd}.moment{display:grid;grid-template-columns:42px 12px 1fr;gap:10px;padding:12px 0}.momentDate{font:12px Georgia,serif;color:var(--muted)}.momentLine{position:relative}.momentLine:before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;background:var(--accent);border-radius:50%}.momentLine:after{content:"";position:absolute;left:6px;top:16px;bottom:-20px;width:1px;background:var(--line)}.moment:last-child .momentLine:after{display:none}.moment img{width:100%;height:110px;object-fit:cover;border-radius:14px}.moment h4{margin:8px 0 3px}.collectionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}.country{min-height:165px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:13px;position:relative;overflow:hidden}.country .art{position:absolute;right:-10px;bottom:-15px;font-size:82px;opacity:.1}.country h3{font:21px Georgia,serif;margin:2px 0}.country p{font-size:11px;color:var(--muted);line-height:1.5}.search{margin:10px 20px 4px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);width:calc(100% - 40px);outline:none}.fab{position:fixed;z-index:10;bottom:86px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--ink);color:white;font-size:26px;box-shadow:0 10px 30px #17252a33}.nav{position:fixed;z-index:9;bottom:0;left:50%;transform:translateX(-50%);width:min(860px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.nav button{font-size:10px;color:var(--muted);padding:5px}.nav button.active{color:var(--ink);font-weight:700}.nav .navIcon{font-size:18px;line-height:19px}.form{padding:12px 20px}.field{margin:14px 0}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:13px;outline:none}.field textarea{min-height:90px;resize:vertical}.primary{width:100%;background:var(--ink);color:white;padding:14px;border-radius:14px;font-weight:700}.secondary{background:#e8e9e4;padding:11px 14px;border-radius:12px;font-weight:600}.danger{background:#f3dfda;color:#9c412d;padding:11px 14px;border-radius:12px;font-weight:600}.mediaPicker{border:1px dashed #b8b1a7;border-radius:16px;padding:16px;background:var(--paper)}.mediaPicker input{margin-top:8px}.backrow{padding:18px 20px 0;display:flex;align-items:center;gap:12px}.backrow button{font-size:24px}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.modal{position:fixed;inset:0;background:#17252a66;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.sheetHeader{display:flex;justify-content:space-between;align-items:center}.sheetHeader h2{font:26px Georgia,serif;margin:0}.close{font-size:28px}.uploadPreview{display:flex;gap:8px;overflow:auto;margin-top:8px}.uploadPreview img{width:70px;height:70px;object-fit:cover;border-radius:10px}.notice{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}
@media(min-width:700px){body{padding:25px}.app{border-radius:30px;overflow:hidden;box-shadow:0 20px 80px #0002;min-height:900px}.hero{padding:18px 30px 28px}.heroImage{height:360px;border-radius:28px}.heroText{left:42px;right:42px;bottom:34px}.heroText h1{font-size:56px}.metrics{margin:0 30px}.section{padding-left:30px;padding-right:30px}}
</style></head>
<body><div class="app">
<div id="home" class="view active"></div><div id="explore" class="view"></div><div id="trips" class="view"></div><div id="trip" class="view"></div><div id="collection" class="view"></div><div id="addTrip" class="view"></div><div id="more" class="view"></div>
<button class="fab" onclick="openEditor()">＋</button>
<nav class="nav"><button class="active" data-view="home" onclick="showView('home',this)"><div class="navIcon">⌂</div>Home</button><button data-view="explore" onclick="showView('explore',this)"><div class="navIcon">◎</div>Explore</button><button data-view="trips" onclick="showView('trips',this)"><div class="navIcon">◫</div>Journeys</button><button data-view="collection" onclick="showView('collection',this)"><div class="navIcon">◇</div>Collection</button><button data-view="more" onclick="showView('more',this)"><div class="navIcon">•••</div>More</button></nav>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHeader"><h2 id="modalTitle">Add a journey</h2><button class="close" onclick="closeEditor()">×</button></div><div class="form"><div class="field"><label>Trip title</label><input id="fTitle" placeholder="e.g. Summer in Italy"></div><div class="field"><label>Country</label><input id="fCountry" placeholder="e.g. Italy"></div><div class="field"><label>City or cities</label><input id="fCity" placeholder="e.g. Rome, Florence"></div><div class="field"><label>Start date</label><input id="fStart" type="date"></div><div class="field"><label>End date</label><input id="fEnd" type="date"></div><div class="field"><label>Story</label><textarea id="fStory" placeholder="What do you remember?"></textarea></div><div class="field"><label>Photos</label><div class="mediaPicker">Choose photos from your phone.<input id="fPhotos" type="file" accept="image/*" multiple><div id="uploadPreview" class="uploadPreview"></div><div class="notice">Photos are stored locally in this prototype on this device/browser.</div></div></div><div class="actions"><button class="secondary" onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveEditor()">Save journey</button></div><div id="deleteWrap" class="actions" style="display:none"><button class="danger" onclick="deleteCurrent()">Delete journey</button></div></div></div></div>
<script>
const defaults=[
{id:'vegas',title:'Las Vegas',country:'USA',cities:'Las Vegas, AREA15, Hoover Dam',start:'2026-08-04',end:'2026-08-10',story:'DEF CON med teamet. Teknologi, netværk og lidt for meget Vegas.',image:'assets/vegas2.svg',photos:['assets/vegas2.svg','assets/vegas.svg'],tags:['DEF CON','AREA15','Hoover Dam']},
{id:'lisbon',title:'Lisbon',country:'Portugal',cities:'Lisbon',start:'2026-11-08',end:'2026-11-13',story:'By, mad og en tur med Sporting i kalenderen.',image:'assets/lisbon.svg',photos:['assets/lisbon.svg'],tags:['CITY','FOOD']},
{id:'london',title:'London',country:'United Kingdom',cities:'London',start:'2026-11-14',end:'2026-11-16',story:'Weekend i London.',image:'assets/london.svg',photos:['assets/london.svg'],tags:['CITY']},
{id:'germany',title:'Lübeck & Sierksdorf',country:'Germany',cities:'Lübeck, Sierksdorf',start:'2025-07-01',end:'2025-07-08',story:'Family holiday.',image:'assets/germany.svg',photos:['assets/germany.svg'],tags:['FAMILY']},
{id:'italy',title:'Rome · Florence · Venice',country:'Italy',cities:'Rome, Florence, Venice',start:'2024-06-01',end:'2024-06-10',story:'Historical memory.',image:'assets/italy.svg',photos:['assets/italy.svg'],tags:['MEMORY']}
];

function normalizeTrip(t){
  const cities=Array.isArray(t.cities)?t.cities:(t.cities||'').split(',').map(x=>x.trim()).filter(Boolean);
  const locations=Array.isArray(t.locations)&&t.locations.length?t.locations:cities.map(city=>({city,country:t.country||'Unknown'}));
  return {...t,country:(t.country||locations[0]?.country||'Unknown').trim(),cities,locations,photos:Array.isArray(t.photos)?t.photos:[],tags:Array.isArray(t.tags)?t.tags:[]};
}
let stored=JSON.parse(localStorage.getItem('travelPokedexTrips')||'null');
let trips=(stored||defaults).map(normalizeTrip);let editingId=null;let pendingPhotos=[];
function persist(){localStorage.setItem('travelPokedexTrips',JSON.stringify(trips));renderAll()}
function fmt(t){if(!t)return 'Dato ikke angivet';const d=new Date(t+'T12:00:00');return d.toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'}).replace('.','')}
function year(t){return t?new Date(t+'T12:00:00').getFullYear():'Ukendt'}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function cityList(t){return (t.locations||[]).map(x=>x.city).filter(Boolean)}
function countryList(){return [...new Set(trips.flatMap(t=>(t.locations||[]).map(x=>x.country).filter(Boolean)))]}
function allCities(){return [...new Set(trips.flatMap(cityList))]}
function countryStats(country){const ts=trips.filter(t=>(t.locations||[]).some(l=>l.country===country));return {trips:ts.length,cities:new Set(ts.flatMap(cityList)).size,photos:ts.reduce((n,t)=>n+(t.photos||[]).length,0)}}
function card(t){return `<div class="journeyCard" onclick="openTrip('${t.id}')"><img class="thumb" src="${t.image||'assets/vegas.svg'}"><div class="grow"><span class="small">${esc(t.country).toUpperCase()} · ${fmt(t.start)}</span><h3>${esc(t.title)}</h3><span class="small">${esc(cityList(t).join(', '))}</span><div class="tags">${(t.tags||[]).slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><b>›</b></div>`}
function showView(id,btn){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');else{const b=document.querySelector('.nav button[data-view="'+id+'"]');if(b)b.classList.add('active')}window.scrollTo(0,0)}
function openTrip(id='vegas'){const t=trips.find(x=>x.id===id);if(!t)return;document.getElementById('trip').innerHTML=`<div class="detailHero" style="background-image:url('${t.image||'assets/vegas2.svg'}')"><button onclick="showView('trips')" style="color:white;font-size:26px">‹</button><button onclick="openEditor('${t.id}')" style="color:white;font-size:15px;background:#0006;border-radius:99px;padding:7px 10px">Edit</button><div class="title"><div style="font-size:12px;letter-spacing:.1em">${esc(t.country).toUpperCase()} · ${year(t.start)}</div><h1>${esc(t.title)}</h1><p>${fmt(t.start)}${t.end?' – '+fmt(t.end):''}</p></div></div><div class="detailBody"><div class="quote">“${esc(t.story||'Ingen historie endnu.')}”</div><div class="detailMetrics"><div class="dmetric"><b>${days(t)}</b><span>Days</span></div><div class="dmetric"><b>${cityList(t).length}</b><span>Places</span></div><div class="dmetric"><b>${(t.photos||[]).length}</b><span>Photos</span></div><div class="dmetric"><b>0</b><span>Videos</span></div></div><div class="tabs"><button class="tab active" onclick="tripTab('story',this)">Story</button><button class="tab" onclick="tripTab('moments',this)">Moments</button><button class="tab" onclick="tripTab('route',this)">Map</button><button class="tab" onclick="tripTab('media',this)">Media</button></div><div id="story"><div class="section" style="padding:8px 0"><div class="sectionTitle"><h2>Places</h2><span class="small">${cityList(t).length} cities / places</span></div><div class="tags" style="margin-bottom:16px">${cityList(t).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><div class="sectionTitle"><h2>Highlights</h2><span class="small">${(t.photos||[]).length} photos</span></div><div class="mediaGrid">${(t.photos||[]).map(p=>`<img src="${p}">`).join('')}</div></div></div><div id="moments" style="display:none"><div class="empty">Moments bliver næste lag i historikken.</div></div><div id="route" style="display:none"><div class="mapbox" style="margin:8px 0"><div class="mapLabel" style="left:10%;top:65%">${esc(t.title)}</div><div class="mapLabel" style="right:8%;top:25%">${esc(t.country)}</div></div></div><div id="media" style="display:none"><div class="mediaGrid" style="padding:8px 0">${(t.photos||[]).map(p=>`<img src="${p}">`).join('')}</div></div></div>`;showView('trip')}
function days(t){if(!t.start||!t.end)return '—';return Math.max(1,Math.round((new Date(t.end)-new Date(t.start))/86400000)+1)}
function tripTab(id,btn){['story','moments','route','media'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.tabs .tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function renderHome(){const recent=[...trips].sort((a,b)=>(b.start||'').localeCompare(a.start||''));document.getElementById('home').innerHTML=`<div class="top"><div class="brand">TRAVEL POKÉDEX</div></div><div class="hero"><div class="heroImage"><div class="heroText"><small>YOUR JOURNEY</small><h1>Mikkel</h1><p>Places shape people.</p></div></div></div><div class="metrics"><div class="metric"><b>${countryList().length}</b><span>Countries</span></div><div class="metric"><b>${allCities().length}</b><span>Cities</span></div><div class="metric"><b>${trips.length}</b><span>Trips</span></div><div class="metric"><b>${trips.reduce((n,t)=>n+(t.photos||[]).length,0)}</b><span>Photos</span></div></div><div class="section"><div class="sectionTitle"><h2>Recent journeys</h2><button class="small" onclick="showView('trips')">See all</button></div>${recent.slice(0,3).map(card).join('')||'<div class="empty">No journeys yet.</div>'}</div>`}
function renderTrips(){const sorted=[...trips].sort((a,b)=>(b.start||'').localeCompare(a.start||''));let html='<div class="top"><div><div class="small">YOUR HISTORY</div><h1 class="serif" style="margin:3px 0;font-size:30px">Journeys</h1></div></div><div class="timeline">';let last=null;sorted.forEach(t=>{const y=year(t.start);if(y!==last){html+=`<div class="year">${y}</div>`;last=y}html+=`<div class="timelineItem"><div class="timelineDate">${t.start?new Date(t.start+'T12:00:00').toLocaleDateString('da-DK',{month:'short'}).toUpperCase():''}</div><div class="timelineDot"></div><div>${card(t)}</div></div>`});html+='</div>';document.getElementById('trips').innerHTML=html}
function renderCollection(){const grouped=countryList();const icons=['🌍','🏛️','🏰','🌊','🏙️','🗺️'];document.getElementById('collection').innerHTML=`<div class="top"><div><div class="small">YOUR WORLD</div><h1 class="serif" style="margin:3px 0;font-size:30px">Collection</h1></div></div><input class="search" placeholder="Search countries or cities…" oninput="filterCollection(this.value)"><div id="collectionGrid" class="collectionGrid">${grouped.map((c,i)=>{const st=countryStats(c);return `<div class="country" data-search="${esc(c+' '+trips.filter(t=>(t.locations||[]).some(l=>l.country===c)).flatMap(cityList).join(' ')).toLowerCase()}"><div class="small">${icons[i%icons.length]} ${esc(c).toUpperCase()}</div><h3>${st.trips} ${st.trips===1?'visit':'visits'}</h3><p>${st.cities} cities · ${st.photos} photos</p><div class="tags">${[...new Set(trips.filter(t=>(t.locations||[]).some(l=>l.country===c)).flatMap(cityList))].slice(0,4).map(city=>`<span class="tag">${esc(city)}</span>`).join('')}</div><div class="art">${icons[i%icons.length]}</div></div>`}).join('')}</div><div class="section"><div class="sectionTitle"><h2>All cities</h2><span class="small">${allCities().length}</span></div><div class="tags">${allCities().map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div></div>`}
function filterCollection(q){document.querySelectorAll('.country').forEach(e=>e.style.display=e.dataset.search.includes(q.toLowerCase())?'block':'none')}
function renderMore(){document.getElementById('more').innerHTML=`<div class="top"><div><div class="small">YOUR JOURNEY</div><h1 class="serif" style="margin:3px 0;font-size:30px">Overview</h1></div></div><div class="section"><div class="sectionTitle"><h2>Your archive</h2><span class="small">Stored locally</span></div><div class="metrics" style="margin:0"><div class="metric"><b>${trips.length}</b><span>Trips</span></div><div class="metric"><b>${countryList().length}</b><span>Countries</span></div><div class="metric"><b>${allCities().length}</b><span>Cities</span></div><div class="metric"><b>${trips.reduce((n,t)=>n+(t.photos||[]).length,0)}</b><span>Photos</span></div></div></div><div class="section"><div class="journeyCard"><div style="font-size:28px">💾</div><div class="grow"><b>Prototype storage</b><div class="small">Changes are saved in this browser. Countries and cities are derived from your journeys automatically.</div></div></div></div>`}
function renderExplore(){document.getElementById('explore').innerHTML=`<div class="top"><div><div class="small">YOUR WORLD</div><h1 class="serif" style="margin:3px 0;font-size:30px">Explore</h1></div></div><div class="mapbox"><div class="mapLabel" style="left:12%;top:58%">Europe</div><div class="mapLabel" style="left:62%;top:32%">USA</div><div class="mapLabel" style="right:8%;top:55%">Asia</div></div><div class="section"><div class="sectionTitle"><h2>Places visited</h2><span class="small">${countryList().length} countries · ${allCities().length} cities</span></div>${countryList().map(c=>`<span class="tag" style="display:inline-block;margin:0 5px 5px 0">${esc(c)}</span>`).join('')}</div>`}
function openEditor(id=null){editingId=id;pendingPhotos=[];document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=id?'Edit journey':'Add a journey';document.getElementById('deleteWrap').style.display=id?'flex':'none';const t=id?trips.find(x=>x.id===id):{};document.getElementById('fTitle').value=t.title||'';document.getElementById('fCountry').value=t.country||'';document.getElementById('fCity').value=cityList(t).join(', ');document.getElementById('fStart').value=t.start||'';document.getElementById('fEnd').value=t.end||'';document.getElementById('fStory').value=t.story||'';document.getElementById('uploadPreview').innerHTML=(t.photos||[]).map(p=>`<img src="${p}">`).join('');document.getElementById('fPhotos').value=''}
function closeEditor(){document.getElementById('modal').classList.remove('show')}
document.getElementById('fPhotos').addEventListener('change',e=>{pendingPhotos=[];[...e.target.files].slice(0,8).forEach(file=>{if(file.size>6*1024*1024)return;const r=new FileReader();r.onload=ev=>{pendingPhotos.push(ev.target.result);document.getElementById('uploadPreview').innerHTML=pendingPhotos.map(p=>`<img src="${p}">`).join('')};r.readAsDataURL(file)})});
function saveEditor(){const title=document.getElementById('fTitle').value.trim()||'New journey';const country=document.getElementById('fCountry').value.trim()||'Unknown';const cities=document.getElementById('fCity').value.split(',').map(x=>x.trim()).filter(Boolean);const t={id:editingId||'trip_'+Date.now(),title,country,cities,locations:cities.map(city=>({city,country})),start:document.getElementById('fStart').value,end:document.getElementById('fEnd').value,story:document.getElementById('fStory').value.trim(),tags:editingId?(trips.find(x=>x.id===editingId)?.tags||[]):['NEW']};if(editingId){const old=trips.find(x=>x.id===editingId);t.image=old.image;t.photos=pendingPhotos.length?pendingPhotos:(old.photos||[]);trips=trips.map(x=>x.id===editingId?t:x)}else{t.image=pendingPhotos[0]||'assets/vegas.svg';t.photos=pendingPhotos;trips.unshift(t)}persist();closeEditor();showView('trips')}
function deleteCurrent(){if(!editingId)return;if(confirm('Delete this journey?')){trips=trips.filter(t=>t.id!==editingId);persist();closeEditor();showView('trips')}}
function renderAll(){renderHome();renderTrips();renderCollection();renderMore();renderExplore()}
renderAll();
</script></body></html>
