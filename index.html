<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#e9e9ea"><meta name="description" content="Et personligt arkiv over de steder, du har været.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Wayfarer">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Wayfarer</title>
<style>
:root{--bg:#e9e9ea;--card:#f6f6f6;--ink:#0b0b0c;--muted:#5b5f64;--line:#d5d5d8;--amb:#f5b301;--shadow:0 10px 30px rgba(0,0,0,.08),0 1px 0 rgba(255,255,255,.9) inset;--font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.blackCard :focus-visible,.hero :focus-visible,.celebrate :focus-visible,.lightbox :focus-visible,.dcard:focus-visible{outline-color:#fff}
.app{max-width:560px;margin:auto;min-height:100vh;min-height:100dvh;padding-bottom:130px;position:relative;background:var(--bg)}
.view{display:none}.view.active{display:block}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0;min-height:60px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tools{display:flex;gap:8px}
.iconBtn{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
.thumbs{display:flex;align-items:center;min-height:40px}
.thumbs img,.thumbs .more{width:34px;height:34px;border-radius:17px;object-fit:cover;border:2px solid var(--bg);box-sizing:content-box;margin-left:-10px;background:#c9c9cc}
.thumbs>:first-child{margin-left:0}
.thumbs .more{background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.head{padding:22px 20px 0;display:flex;flex-direction:column;gap:6px}
.head.row2{flex-direction:row;align-items:flex-end;justify-content:space-between}
.head.row2>div:first-child{display:flex;flex-direction:column;gap:6px}
.cap,.capS,.capC,.capL,.capL2,.cap2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.capS{font-size:10px;letter-spacing:.1em}.capC{text-align:center;margin-top:14px}
.capL{font-size:10px;color:#a9adb2}.capL2{color:#d0d3d6}
.num{font-weight:500;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.empty{padding:60px 24px;text-align:center;color:var(--muted);line-height:1.6}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.grow{flex:1;min-width:0}

/* home deck */
.homeTop{padding:28px 20px 0;display:flex;align-items:center;justify-content:space-between}
.homeBrand{font-size:28px;font-weight:700;letter-spacing:-.04em;color:#17172d}.homeBrand span{color:#7253e8}
.homeTag{padding:2px 20px 0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#66627f;font-weight:600}
.homeFeature{position:relative;display:block;width:calc(100% - 32px);height:clamp(370px,64vh,560px);min-height:410px;margin:26px 16px 0;padding:0;appearance:none;text-align:left;font-family:inherit;border-radius:26px;overflow:hidden;background:#17172d;color:#fff;box-shadow:0 16px 34px rgba(20,18,50,.18)}
.homeFeature>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.homeFeature .hfScrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,37,.28),rgba(11,13,37,.02) 38%,rgba(11,13,37,.35) 55%,#11152f 84%)}
.hfLabel{position:absolute;top:24px;left:24px;padding:11px 18px;border-radius:24px;background:#b94d55;color:white;font-size:11px;letter-spacing:.2em;font-weight:700}
.hfMore{position:absolute;top:18px;right:18px;width:48px;height:48px;border-radius:50%;background:#ffffff20;color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px)}
.hfInfo{position:absolute;left:26px;right:24px;bottom:122px}
.hfCity{font-size:clamp(38px,11vw,62px);font-weight:400;line-height:1;letter-spacing:.06em;text-transform:uppercase}
.hfDate{margin-top:12px;font-size:15px;letter-spacing:.2em;color:#e9e7f0;text-transform:uppercase}
.hfStory{position:absolute;right:25px;bottom:220px;max-width:36%;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;font-size:16px;font-style:italic;line-height:1.25;text-align:right;color:#f4edf4}
.hfFooter{position:absolute;left:0;right:0;bottom:0;min-height:108px;padding:18px 20px;display:flex;align-items:center;gap:12px;background:#11152ff2;border:1px solid #ffffff18;border-radius:25px 25px 0 0}
.hfRing{width:70px;height:70px;border:6px solid #34364d;border-right-color:#7959f2;border-top-color:#7959f2;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.hfFootText{min-width:0;flex:1}.hfFootText .capL{font-size:10px}.hfFootText strong{font-size:clamp(16px,4.5vw,21px);line-height:1.1;display:block;margin-top:3px}
.hfAction{height:54px;min-width:118px;padding:0 16px;border-radius:30px;background:#5540bb;color:white;font-size:14px;font-weight:600;line-height:1.2;display:flex;align-items:center;justify-content:center;white-space:nowrap;flex:none}
.homeSection{margin:24px 16px 0;padding:18px 16px 16px;border-radius:24px;background:#f6f5fa}
.homeSectionHead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px;font-size:18px;font-weight:700}
.homeSectionHead button{font-size:13px;color:#615b7e;display:flex;align-items:center;gap:4px}
.scheduleRow{width:100%;min-height:78px;padding:12px 14px;border-radius:18px;background:#eeecf8;display:flex;align-items:center;gap:14px;text-align:left}
.scheduleIcon{width:54px;height:54px;border-radius:50%;background:#dcd5ff;color:#23213c;display:grid;place-items:center;font-size:22px;flex:none}
.scheduleCopy{min-width:0;flex:1}.scheduleCopy b{display:block;font-size:16px}.scheduleCopy span{display:block;margin-top:4px;color:#66627f;font-size:14px}
.homeCarousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 4px;touch-action:pan-x;scrollbar-width:none}.homeCarousel::-webkit-scrollbar{display:none}
.miniTrip{position:relative;width:min(53vw,230px);height:118px;flex:none;border-radius:18px;overflow:hidden;color:#fff;text-align:left;scroll-snap-align:start;background:#34364d}
.miniTrip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.miniTrip:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(12,15,39,.9))}
.miniTrip span{position:absolute;z-index:1;left:14px;right:12px;bottom:12px;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.planForm{margin:0 20px 18px;padding:16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.planForm input,.planForm select{height:46px;width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 13px;margin-bottom:9px}
.planForm textarea{min-height:82px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 13px;margin-bottom:9px;line-height:1.4}
.planForm .primary{margin-top:2px}
.planList{display:flex;flex-direction:column;gap:9px}
.planItem{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.planCheck{width:28px;height:28px;border:1.5px solid #aaaab2;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px;color:#fff}
.planItem.done .planCheck{background:#27834a;border-color:#27834a}
.planCopy{flex:1;min-width:0}.planTitle{font-weight:600;font-size:15px}.planType{margin-top:3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.planNote{font-size:13px;color:var(--muted);line-height:1.45;margin-top:7px;white-space:pre-wrap}.planItem.done .planTitle{text-decoration:line-through;color:var(--muted)}
.planAddress{display:block;margin-top:7px;font-size:13px;color:#5540bb;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.planActions{display:flex;gap:2px;align-items:center;flex:none}.planDelete,.planAction{width:30px;height:30px;border-radius:15px;color:var(--muted);display:grid;place-items:center}
.planAction:disabled{opacity:.3;cursor:default}
.planEditForm{flex:1;min-width:0}.planEditForm input,.planEditForm select{height:40px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 10px;margin-bottom:7px}.planEditForm .actions{margin-top:3px}
#trip .tabBody[data-body="plans"]{padding:18px 0 0}
.deckWrap{position:relative;height:376px;margin-top:22px;overflow:visible}
.deck{position:relative;width:250px;height:352px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:8px}
.dcard{position:absolute;left:0;top:0;width:250px;height:352px;border-radius:22px;overflow:hidden;background:#3a3c40;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s;box-shadow:0 14px 28px rgba(0,0,0,.18);cursor:pointer;color:#fff;text-align:left;display:block}
.dcard.front{box-shadow:0 26px 44px rgba(0,0,0,.30)}
.dcard img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.dcard .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.3) 0%,rgba(11,11,12,0) 30%,rgba(11,11,12,.78) 100%)}
.dcard .veil{position:absolute;inset:0;background:#0b0b0c;opacity:0;transition:opacity .34s}
.dcard .no{position:absolute;left:16px;top:16px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.22);font-size:11px;font-weight:700;letter-spacing:.1em}
.dcard.up .no{background:var(--amb);color:var(--ink)}
.dcard.up{outline:2px solid var(--amb);outline-offset:-2px}
.dcard .txt{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 14px;text-align:center;transition:opacity .2s}
.dcard:not(.front) .txt,.dcard:not(.front) .no{opacity:0}
.dt{font-weight:300;letter-spacing:.12em;text-transform:uppercase;line-height:1.15}
.rule{display:block;width:72px;height:2px;background:#fff}
.dmeta{font-size:11px;font-weight:500;letter-spacing:.14em}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px;min-height:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:3px;background:#b9b9bd;transition:width .2s}.dot.on{width:22px;background:var(--ink)}
/* home progress card (replaces the old lonely ring) */
.progressCard{margin:18px 20px 0;display:flex;flex-direction:column;gap:0}
.pgMain{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:#fff}
.pgMain>svg{flex:none}
.pgTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pgMain>.chev,.pgMain svg:last-child{flex:none;opacity:.6}
.pgChips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #2c2e31}
.pgChip{min-height:32px;padding:0 12px;border-radius:16px;border:1.5px dashed #6b6d70;color:#e7e7ea;font-size:12px;font-weight:700;letter-spacing:.04em}
.pgMore{display:flex;align-items:center;font-size:12px;color:#a9adb2;padding:0 4px}

/* world */
.globeBox{position:relative;width:324px;height:324px;margin:18px auto 0;filter:drop-shadow(0 14px 22px rgba(0,0,0,.10))}
.globeBox.small{width:300px;height:300px}
.globeBox canvas{display:block;touch-action:none;border-radius:50%;cursor:grab}
.resetBtn{position:absolute;right:-8px;bottom:-4px;width:40px;height:40px;filter:none}
.legend{display:flex;gap:18px;align-items:center;padding:8px 20px 0;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:7px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:6px}.lgv{background:var(--ink)}.lgu{background:var(--amb);box-shadow:0 0 0 1px var(--ink)}
.blackCard{position:relative;background:var(--ink);color:#fff;border-radius:24px;padding:16px 20px;box-shadow:0 16px 30px rgba(0,0,0,.22)}
.nextCard{margin:14px 20px 0;min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nextCard>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.nextTitle{font-size:24px;font-weight:700;letter-spacing:-.01em}
.bigDays{display:flex;align-items:flex-end;gap:6px}.bigDays .capL{padding-bottom:6px}
.ambDot{position:absolute;right:16px;top:14px;width:9px;height:9px;border-radius:5px;background:var(--amb)}
.ambBtn{width:44px;height:44px;border-radius:22px;background:var(--amb);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.metrics3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:22px 20px 0}
.metrics3>div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.metrics3 .cap{padding-left:.12em}   /* letter-spacing adds a trailing gap; offset it so the label is optically centred */
.metrics3.pad{padding-top:24px}

/* journeys */
.rows{display:flex;flex-direction:column;gap:10px;padding:20px 20px 0}
.jrow{position:relative;min-height:68px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.jrow.sel{background:var(--ink);color:#fff;min-height:78px;box-shadow:0 16px 30px rgba(0,0,0,.22)}
.jrow.sel .capS{color:#a9adb2}.jrow:focus-visible{outline-offset:3px}.jrow.sel:focus-visible{outline-color:#fff}
.jl{display:flex;flex-direction:column;gap:5px;min-width:0}.jt{font-size:16px;font-weight:500;letter-spacing:-.01em}.jrow.sel .jt{font-size:18px;font-weight:700}
.jr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.jrow .ambDot{right:12px;top:10px;width:8px;height:8px}
.pills{display:flex;gap:8px;padding:18px 20px 0;flex-wrap:wrap}
.pill{height:44px;padding:0 18px;border-radius:22px;font-size:13px;font-weight:500;color:var(--muted)}
.pill.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* passport */
.ratio{display:flex;align-items:flex-end;gap:6px}.ratio .cap{padding-bottom:8px}
.stampCard{margin:18px 20px 0;border-radius:28px;background:var(--card);box-shadow:var(--shadow);padding:18px 8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 2px}
.stampWrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:150px;min-height:130px}
.blotch{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:52px;background:var(--amb);opacity:.55}
.stampWrap svg{position:relative;z-index:1}
.emptySlot{width:130px;height:80px;border:1.5px dashed #b4b6ba;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(3deg);font-size:12px;color:var(--muted)}
.passCard{margin:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.passCard>div:first-child{display:flex;flex-direction:column;gap:4px}
.pbar{width:150px;display:flex;flex-direction:column;gap:6px}.pbar .right{text-align:right}
.track{height:8px;border-radius:4px;background:#3a3c40;overflow:hidden}.fill{height:8px;background:var(--amb);border-radius:4px}

/* trip */
.hero{position:relative;height:340px;background:#3a3c40 center/cover no-repeat;color:#fff}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.35) 0%,rgba(11,11,12,0) 28%,rgba(11,11,12,.8) 100%)}
.ghost{position:absolute;top:16px;height:44px;min-width:44px;border-radius:22px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 12px;z-index:2;backdrop-filter:blur(6px)}
.ghost.edit{padding:0 18px;font-size:14px;font-weight:500}
.heroText{position:absolute;left:20px;right:84px;bottom:22px;display:flex;flex-direction:column;gap:6px;z-index:1}
.cap2{font-size:12px;letter-spacing:.12em;color:#fff;text-transform:uppercase;font-weight:500}
.heroTitle{margin:0;font-size:36px;font-weight:300;letter-spacing:.08em;line-height:1.08;text-transform:uppercase}
.badge{position:absolute;right:20px;bottom:22px;width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;z-index:2}
.tabs2{display:flex;gap:6px;padding:10px 20px 0;overflow-x:auto}
.tabs2 button{height:44px;padding:0 10px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs2 button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--amb)}
.tabBody{padding:18px 20px 0}
.mrow{display:flex;gap:26px;flex-wrap:wrap}.mrow>div{display:flex;flex-direction:column;gap:5px}
.storyTxt{font-size:16px;line-height:1.55;margin:18px 0 0}.storyTxt.center{text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chip{font-size:12px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--shadow)}
.pcard{position:relative;display:block;width:100%;height:96px;border-radius:18px;overflow:hidden;margin-top:12px;box-shadow:0 12px 24px rgba(0,0,0,.16);text-align:left;color:#fff}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scrimD{position:absolute;inset:0;background:rgba(11,11,12,.5)}
.pc{position:absolute;left:18px;bottom:14px;display:flex;flex-direction:column;gap:3px}.pc b{font-size:10px;letter-spacing:.14em;color:#f5c94a}.pc span{font-size:19px;font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{display:block;border-radius:16px;overflow:hidden;background:#c9c9cc;aspect-ratio:1/1;padding:0}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.stampBig{display:flex;justify-content:center;padding:26px 0 6px;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}

/* more */
.mlist{padding:22px 20px 0}
.mcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.mi{font-size:26px;line-height:1}.mcard b{display:block;margin-bottom:3px}.mcard .st{margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}

/* nav pill */
.pillNav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:6px;padding:6px;border-radius:33px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.16)}
.pillNav button{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pillNav button.on{background:var(--ink);color:#fff}
.pillNav button:focus-visible{outline-offset:1px}

/* buttons + forms */
.primary{width:100%;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.primary[disabled]{opacity:.5;cursor:default}
.secondary{height:46px;padding:0 18px;border-radius:23px;background:#fff;box-shadow:var(--shadow);font-weight:500;font-size:14px}
.secondary[aria-pressed=true]{background:var(--ink);color:#fff}
.danger{height:46px;padding:0 18px;border-radius:23px;background:#f6dcd6;color:#8f2a17;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(11,11,12,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:20px}
.sheetHeader{display:flex;justify-content:space-between;align-items:center}.sheetHeader h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.close{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.form{padding:8px 0}.field{margin:14px 0}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.mediaPicker{border:1.5px dashed #b4b6ba;border-radius:18px;padding:16px;background:var(--card);font-size:14px}
.mediaPicker input{margin-top:8px;border:0;padding:0;background:none;width:auto}
.notice{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.draftGrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.draftItem{position:relative;width:76px;height:76px}
.draftItem .draftImg{display:block;width:100%;height:100%;padding:0;border-radius:14px;overflow:hidden;border:2px solid transparent}
.draftItem.cover .draftImg{border-color:var(--amb)}
.draftItem img{width:100%;height:100%;object-fit:cover;display:block}
.draftRm{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;line-height:1}
.coverBadge{position:absolute;left:4px;bottom:4px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--amb);color:var(--ink);font-weight:700;border-radius:99px;padding:2px 6px;pointer-events:none}
.formMsg{margin:10px 0 0;font-size:13px;color:#a02d18;min-height:1em}.formMsg.info{color:var(--muted)}
#modalTitle:focus{outline:none}

/* toast */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 14px;border-radius:16px;font-size:13px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{color:var(--amb);font-weight:700;min-height:32px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:50;background:var(--ink);color:#fff;display:none;overflow:auto}.celebrate.show{display:block}
.cRings{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none}
.cIn{position:relative;max-width:420px;margin:0 auto;min-height:100%;padding:56px 28px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cTag{height:26px;padding:0 12px;border-radius:6px;background:var(--amb);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.14em;display:flex;align-items:center}
.cStamp{margin-top:34px;animation:stampIn .7s cubic-bezier(.2,.9,.25,1.1) both}
.cName{margin:24px 0 10px;font-size:30px;font-weight:300;letter-spacing:.14em;text-transform:uppercase}
.cSub{margin-top:12px;font-size:12px;letter-spacing:.14em;color:#d0d3d6}
.cRow{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:34px}
.cNum{display:flex;align-items:flex-end;gap:8px}.cNum .capL{padding-bottom:10px}
.cProg{width:130px;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;text-align:left}
.cBtns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:34px}
.cBtns button{height:54px;border-radius:27px;font-size:16px;font-weight:700}
.cBtns .amb{background:var(--amb);color:var(--ink)}.cBtns .outline{border:1px solid #5d6064;color:#fff;font-weight:500;height:50px}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-28deg);opacity:0}55%{transform:scale(.93) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(11,11,12,.95);display:none;align-items:center;justify-content:center;touch-action:pan-y}.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:82vh;max-height:82dvh;object-fit:contain;border-radius:8px}
.lbBtn{position:absolute;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
#lbClose{right:16px;top:16px}#lbPrev{left:12px;top:50%;margin-top:-24px}#lbNext{right:12px;top:50%;margin-top:-24px}
#lbCount{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#d0d3d6;font-size:12px;letter-spacing:.14em}

@media(min-width:700px){body{padding:20px 0}.app{border-radius:32px;overflow:hidden;box-shadow:0 20px 80px #0002;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pickBtn{display:inline-flex;align-items:center;margin-top:10px;cursor:pointer}.pickBtn:focus-within,.mediaPicker:focus-within .pickBtn{outline:2px solid var(--ink);outline-offset:2px}

/* gamification */
.sheetDlg{z-index:26}
.ptabs{display:flex;gap:0;padding:18px 10px 0;overflow-x:auto}
.ptab{height:44px;padding:0 8px;border-radius:22px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px;flex:none}
.ptab i{font-style:normal;font-size:10px;min-width:18px;height:18px;border-radius:9px;background:#dcdcdf;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;color:var(--ink)}
.ptab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}.ptab.on i{background:var(--ink);color:#fff}
.panelHead{padding:16px 20px 0}.panelHead.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.capL3{font-size:13px;color:var(--muted);line-height:1.45}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 8px;padding:16px 20px 0}
.medalBtn{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 2px;border-radius:16px}
.mn{font-size:12px;font-weight:600;line-height:1.2}.ms{font-size:11px;color:var(--muted)}
.medalBtn.locked .mn{color:var(--muted);font-weight:500}
.sheetMedal{display:flex;justify-content:center;padding:6px 0 4px}
.lightTrack{background:#d9d9dc;max-width:260px;margin:14px auto 0}
.setList{display:flex;flex-direction:column;gap:10px;padding:14px 20px 0}
.setCard{display:flex;flex-direction:column;gap:9px;background:var(--card);box-shadow:var(--shadow);border-radius:20px;padding:14px 16px;text-align:left}
.sTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.sTop b{font-size:16px;letter-spacing:-.01em}.sCount{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.sBar{display:block;height:6px;border-radius:3px;background:#dcdcdf;overflow:hidden}.sBar span{display:block;height:6px;background:var(--amb);border-radius:3px}
.setCard.done{background:var(--ink);color:#fff}.setCard.done .sBar{background:#3a3c40}.setCard.done .sCount{color:var(--amb)}
.sChips{display:flex;flex-wrap:wrap;gap:5px}.sChips i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:99px;border:1px solid #b4b6ba;color:var(--muted)}
.sChips i.on{background:var(--ink);border-color:var(--ink);color:#fff}.setCard.done .sChips i{border-color:#5d6064;color:#a9adb2}.setCard.done .sChips i.on{background:var(--amb);border-color:var(--amb);color:var(--ink)}
.setRows{display:flex;flex-direction:column;gap:8px}
.setRow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.setRow:last-child{border-bottom:0}
.sc{width:34px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}.sn{flex:1;font-size:15px}.setRow.ok .sn{font-weight:600}
.pill2{font-size:11px;letter-spacing:.06em;padding:6px 11px;border-radius:99px;background:#e3e3e6;color:var(--muted);font-weight:600;white-space:nowrap}
.pill2.ok{background:var(--ink);color:#fff}.pill2.amb{background:var(--amb);color:var(--ink)}.pill2.btn{background:#fff;box-shadow:var(--shadow);color:var(--ink);min-height:36px}
.ambBtn2{height:44px;padding:0 16px 0 12px;border-radius:22px;background:var(--amb);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;flex:none}
.wGroup{padding:16px 20px 0;display:flex;flex-direction:column;gap:8px}
.wRow{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 8px 12px 14px}
.wRow.done{opacity:.78}
.wIcon{width:40px;height:40px;border-radius:20px;background:#fff;border:1.5px dashed #b4b6ba;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;color:var(--muted)}
.wRow.done .wIcon{border-style:solid;border-color:var(--ink);background:var(--ink);color:#fff}
.wMain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.wName{font-size:16px;font-weight:600;letter-spacing:-.01em}.wSub{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.linkBtn{font-size:12px;font-weight:600;text-decoration:underline;min-height:32px}
.wDel{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.wishStamp,.wishMore{display:flex;align-items:center;justify-content:center}.wishMore{width:110px;height:110px;border-radius:55px;border:2px dotted #b4b6ba;color:var(--muted);font-size:13px;font-weight:600}
.seg{display:flex;gap:4px;padding:4px;background:#dcdcdf;border-radius:24px;margin:6px 0 4px}
.seg button{flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:500;color:var(--muted)}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:700}
.sheetDlg .primary{margin-top:6px}
.mGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;margin-top:30px;width:100%}
.mItem{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:1.25}
.memCard{margin-top:18px;background:var(--card);box-shadow:var(--shadow);border-radius:22px;padding:14px 16px}
.memHead{display:flex;align-items:center;gap:14px}.memHead b{font-size:16px}
.mRows{display:flex;flex-direction:column;margin-top:8px}
.mRow{display:flex;gap:12px;align-items:center;min-height:44px;text-align:left;font-size:14px;width:100%;border-top:1px solid var(--line)}.mRow span{width:20px;font-weight:700;text-align:center}
.mRow.ok{color:var(--muted)}.mRow.ok span{color:#1a7f3c}button.mRow{text-decoration:underline;text-underline-offset:3px}
.memCard.done{background:var(--ink);color:#fff}.memCard.done .mRows{display:none}.memCard.done .small{color:var(--amb)}

#sheetTitle:focus{outline:none}

/* places */
.stampBtn{display:block;padding:0;border-radius:24px}
.visitBadge{position:absolute;top:2px;right:10px;z-index:2;min-width:32px;height:26px;padding:0 8px;border-radius:13px;background:var(--ink);color:var(--amb);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.cStampBox{margin:14px 20px 0;padding:18px 0 8px}
.padrow{padding:22px 20px 0}
.secTitle{padding:26px 20px 0}
.cityList{display:flex;flex-direction:column;gap:8px;padding:10px 20px 0}
.cityRow{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px 12px 16px;text-align:left;min-height:60px;width:100%}
.cityRow.up{background:transparent;box-shadow:none;border:1.5px dashed #c9a030}
.cyTxt,.trTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.cyTxt b,.trTxt b{font-size:16px;letter-spacing:-.01em}.cyTxt span,.trTxt span{font-size:12px;color:var(--muted)}
.cnt{min-width:38px;height:28px;padding:0 10px;border-radius:14px;background:var(--ink);color:var(--amb);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tRowSm{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 12px 8px 8px;text-align:left;width:100%;color:var(--ink)}
.tRowSm img{width:48px;height:48px;border-radius:12px;object-fit:cover;flex:none;background:#c9c9cc}.tRowSm.up{outline:1.5px dashed #c9a030;outline-offset:-1.5px;background:transparent;box-shadow:none}
.small2{font-size:13px;padding:18px 8px}
.capBtn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;min-height:44px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}
.chip.link{cursor:pointer}.chip.link:focus-visible{outline-offset:2px}
.tl{padding:8px 20px 0;display:flex;flex-direction:column}
.tlI{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;text-align:left;width:100%;color:var(--ink);align-items:stretch}
.tlDate{display:flex;flex-direction:column;gap:2px;padding-top:14px;font-variant-numeric:tabular-nums}.tlDate b{font-size:15px;font-weight:600}.tlDate span{font-size:11px;color:var(--muted)}
.tlDot{position:relative}.tlDot::before{content:"";position:absolute;left:1px;top:18px;width:11px;height:11px;border-radius:6px;background:var(--ink);border:2px solid var(--bg);box-sizing:content-box}
.tlDot::after{content:"";position:absolute;left:6px;top:34px;bottom:-14px;width:1.5px;background:var(--line)}.tlI:last-child .tlDot::after{display:none}
.tlI.up .tlDot::before{background:var(--amb);box-shadow:0 0 0 1px #c9a030}
.tlCard{display:flex;gap:12px;align-items:flex-start;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:10px;margin-bottom:12px}
.tlI.up .tlCard{background:transparent;box-shadow:none;border:1.5px dashed #c9a030}
.tlCard img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none;background:#c9c9cc}
.tlTxt{display:flex;flex-direction:column;gap:3px;min-width:0}.tlTxt b{font-size:16px;letter-spacing:-.01em}.tlTxt>span{font-size:12px;color:var(--muted)}.tlTxt .tlSn{color:var(--ink);opacity:.78;line-height:1.4;font-size:13px;margin-top:2px}

.sugRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sug{min-height:40px;padding:0 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:13px;font-weight:500}
.sug:active{background:var(--ink);color:#fff}

/* map */
.mapBox{position:relative;margin:18px 20px 0;height:430px;border-radius:26px;overflow:hidden;background:#f4f4f6;box-shadow:var(--shadow)}
.mapBox.small{height:330px;margin:0}
.mapCv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.mapCv:active{cursor:grabbing}
.mapCv:focus-visible{outline:2px solid var(--ink);outline-offset:-3px;border-radius:26px}
.mapModes{position:absolute;left:12px;top:12px;display:flex;gap:2px;padding:3px;border-radius:22px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
.mapModes button{height:38px;padding:0 14px;border-radius:19px;font-size:13px;font-weight:500;color:var(--muted)}
.mapModes button[aria-pressed=true]{background:var(--ink);color:#fff}
.mapCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px}
.mapCtl button{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.mapLoad{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none}
.legend .hint{font-size:11px;color:var(--muted)}

.legend{flex-wrap:wrap;gap:6px 16px}.legend .grow{flex:1;min-width:8px}

.lgv{background:var(--mapv,var(--ink))}.lgu{background:var(--mapu,var(--amb));box-shadow:0 0 0 1px var(--mapud,var(--ink))}
.palRow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.palBtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:var(--shadow);text-align:left;min-height:64px}
.palBtn[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-2px}
.palSw{display:flex;border-radius:8px;overflow:hidden;width:100%;height:18px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}.palSw i{flex:1}
.palN{font-size:13px;font-weight:600}
.mapBox{background:var(--mapocean,#d6e4ec)}

/* storage safety */
.banner{position:sticky;top:0;z-index:35;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#f5b301;color:#0b0b0c;font-size:13px;line-height:1.45}
.banner[hidden]{display:none}.bTxt{flex:1 1 220px}
.banner button{min-height:38px;padding:0 16px;border-radius:19px;background:#0b0b0c;color:#fff;font-weight:600;font-size:13px}
#welcome{z-index:80}
.wIn{padding-top:96px}
.wTitle{margin:0 0 16px;font-size:30px;font-weight:300;letter-spacing:.02em;line-height:1.15}
.wBody{margin:0;color:#d0d3d6;line-height:1.6;font-size:15px}
.wMsg{margin-top:14px;color:#f5b301;font-size:13px;min-height:1em}
.wIn .cBtns{margin-top:36px;padding-top:0}

/* trip map pins */
.tripLegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}.tripLegend span{display:flex;align-items:center;gap:7px}
.pinDot{display:inline-block;width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pinother,#245055);flex:none;box-shadow:0 0 0 1.5px #fff}
.pinDot.main{background:var(--pinmain,#c2542d)}
.pList{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pRow{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:8px 8px 8px 16px;min-height:56px}
.pTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pTxt b{font-size:15px}.pTxt span{font-size:12px;color:var(--muted)}
.pBtn{min-height:44px;padding:0 14px;border-radius:22px;background:#fff;box-shadow:var(--shadow);font-size:12px;font-weight:600;white-space:nowrap}.pBtn.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline;padding:0 8px}
.pNote{margin:10px 4px 0}
.mapHint{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;border-radius:24px;background:var(--ink);color:#fff;font-size:13px;z-index:3}
.mapHint[hidden]{display:none}.mapHint button{min-height:38px;padding:0 14px;border-radius:19px;background:#fff;color:var(--ink);font-weight:600}

/* date-range picker */
.dpField{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:-6px}
.dpDuration{font-size:13px;color:var(--muted);min-height:1em}
.dpOpenBtn{flex:none}
.dpHead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.dpMonth{font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:.04em}
.dpNav{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.dpWd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.dpGrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.dpDay{height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:var(--ink);background:none}
.dpDay.blank{visibility:hidden}
.dpDay.today{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.dpDay.inrange{background:var(--card)}
.dpDay.start,.dpDay.end{background:var(--ink);color:#fff;border-radius:20px}
.dpDay.start:not(.end){border-radius:20px 0 0 20px}
.dpDay.end:not(.start){border-radius:0 20px 20px 0}
.dpSummary{min-height:20px;text-align:center;font-size:13px;color:var(--muted);margin:12px 0 4px}
.sheetDlg .actions button[disabled]{opacity:.45;pointer-events:none}

.stampGap{height:18px}

/* multi-stop places editor */
.stopRow{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.stopRow:first-child{margin-top:6px}
.stopNum{width:26px;height:44px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.stopInputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.stopInputs input{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;outline:none}
.stopInputs input:focus{border-color:var(--ink)}
.stopSug:empty{display:none}
.stopRm{width:44px;height:44px;border-radius:22px;background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.addStopBtn{margin-top:12px;width:100%}

<body><div class="app" id="app"><div id="banner" class="banner" role="alert" hidden></div>
<div id="home" class="view active"><div class="empty" data-i18n="loading">Loading…</div></div><div id="world" class="view"></div><div id="trips" class="view"></div><div id="trip" class="view"></div><div id="passport" class="view"></div><div id="country" class="view"></div><div id="city" class="view"></div><div id="more" class="view"></div>
<nav class="pillNav" aria-label="Main" data-i18n-aria="nav.main"><button class="on" data-view="home" onclick="showView('home')" aria-label="Home" data-i18n-aria="nav.home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></button><button data-view="world" onclick="showView('world')" aria-label="World" data-i18n-aria="nav.world"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3 3.2 14 0 17M12 3.5c-3.2 3-3.2 14 0 17"/></svg></button><button data-view="trips" onclick="showView('trips')" aria-label="Journeys" data-i18n-aria="nav.trips"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></svg></button><button data-view="passport" onclick="showView('passport')" aria-label="Passport" data-i18n-aria="nav.passport"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="3.5" width="13" height="17" rx="2.2"/><circle cx="12" cy="10.5" r="3"/><path d="M8.8 16.5h6.4"/></svg></button></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet"><div class="sheetHeader"><h2 id="modalTitle">Add a journey</h2><button class="close" onclick="closeEditor()" aria-label="Close" data-i18n-aria="aria.close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="form"><div class="field"><label for="fTitle" data-i18n="f.title">Trip title</label><input id="fTitle" data-i18n-ph="ph.title" placeholder="e.g. Summer in Italy" autocomplete="off"></div><datalist id="countryList"></datalist><div class="field"><label data-i18n="f.places">Places</label><div id="stopsList"></div><button type="button" class="secondary addStopBtn" onclick="addStop()" data-i18n="f.addPlace">+ Add a place</button></div><div class="field"><label for="fStart" data-i18n="f.start">Start date</label><input id="fStart" type="date"></div><div class="field"><label for="fEnd" data-i18n="f.end">End date</label><input id="fEnd" type="date"></div><div class="field dpField"><span id="datesDuration" class="small dpDuration" aria-live="polite"></span><button type="button" class="secondary dpOpenBtn" onclick="openDatePicker()" data-i18n="dp.openBtn">Pick on a calendar</button></div><div class="field"><label for="fStory" data-i18n="f.story">Story</label><textarea id="fStory" data-i18n-ph="ph.story" placeholder="What do you remember?"></textarea></div><div class="field"><label for="fPhotos" data-i18n="f.photos">Photos</label><div class="mediaPicker"><span data-i18n="f.pick">Choose photos from your phone.</span><div><label class="secondary pickBtn" for="fPhotos" data-i18n="f.choose">Choose photos</label></div><input id="fPhotos" class="srOnly" type="file" accept="image/*" multiple><div id="uploadPreview" class="draftGrid"></div><div class="notice" data-i18n="f.notice">Photos are resized and stored on this device only. Your own photos replace any sample artwork. Tap a photo to make it the cover; × removes it.</div></div></div><div id="formMsg" class="formMsg" role="alert"></div><div class="actions"><button class="secondary" onclick="closeEditor()" data-i18n="btn.cancel">Cancel</button><button id="saveBtn" class="primary" onclick="saveEditor()" data-i18n="btn.save">Save journey</button></div><div id="deleteWrap" class="actions" style="display:none"><button class="danger" onclick="deleteCurrent()" data-i18n="btn.delete">Delete journey</button></div></div></div></div>
<div id="sheet" class="modal sheetDlg" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet"><div class="sheetHeader"><h2 id="sheetTitle"></h2><button class="close" onclick="closeSheet()" aria-label="Close" data-i18n-aria="sheet.close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetBody" class="form"></div></div></div>
<div id="celebrate" class="celebrate" role="dialog" aria-modal="true" aria-label="New stamp collected" data-i18n-aria="cel.aria"></div>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" data-i18n-aria="lb.aria"><img id="lbImg" src="" alt=""><button id="lbClose" class="lbBtn" onclick="closeLightbox()" aria-label="Close photo viewer" data-i18n-aria="lb.close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button id="lbPrev" class="lbBtn" onclick="lbStep(-1)" aria-label="Previous photo" data-i18n-aria="lb.prev"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button id="lbNext" class="lbBtn" onclick="lbStep(1)" aria-label="Next photo" data-i18n-aria="lb.next"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><div id="lbCount"></div></div>
<div id="welcome" class="celebrate" role="dialog" aria-modal="true" aria-labelledby="wTitle"></div>
<input id="welcomeFile" type="file" accept="application/json,.json" class="srOnly" tabindex="-1" aria-hidden="true">
<input id="importFile" type="file" accept="application/json,.json" class="srOnly" tabindex="-1" aria-hidden="true">
