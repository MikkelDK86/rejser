<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json"><title>Travel Pokédex</title>
<link rel="stylesheet" href="styles.css"></head>
<body><div class="app">
<div id="home" class="view active"></div><div id="explore" class="view"></div><div id="trips" class="view"></div><div id="trip" class="view"></div><div id="collection" class="view"></div><div id="addTrip" class="view"></div><div id="more" class="view"></div>
<button class="fab" onclick="openEditor()">＋</button>
<nav class="nav"><button class="active" data-view="home" onclick="showView('home',this)"><div class="navIcon">⌂</div>Home</button><button data-view="explore" onclick="showView('explore',this)"><div class="navIcon">◎</div>Explore</button><button data-view="trips" onclick="showView('trips',this)"><div class="navIcon">◫</div>Journeys</button><button data-view="collection" onclick="showView('collection',this)"><div class="navIcon">◇</div>Collection</button><button data-view="more" onclick="showView('more',this)"><div class="navIcon">•••</div>More</button></nav>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetHeader"><h2 id="modalTitle">Add a journey</h2><button class="close" onclick="closeEditor()">×</button></div><div class="form"><div class="field"><label>Trip title</label><input id="fTitle" placeholder="e.g. Summer in Italy"></div><div class="field"><label>Places and countries</label><div id="locationList" class="locationList"></div><button type="button" class="secondary" style="margin-top:8px" onclick="addLocation()">＋ Add place</button><div class="helper" style="margin-top:7px">Each place has its own country. Collection, Cities and statistics are derived automatically.</div></div><div class="field"><label>Start date</label><input id="fStart" type="date"></div><div class="field"><label>End date</label><input id="fEnd" type="date"></div><div class="field"><label>Story</label><textarea id="fStory" placeholder="What do you remember?"></textarea></div><div class="field"><label>Photos</label><div class="mediaPicker">Choose photos from your phone.<input id="fPhotos" type="file" accept="image/*" multiple><div id="uploadPreview" class="uploadPreview"></div><div class="notice">Photos are stored locally in this prototype on this device/browser.</div></div></div><div class="actions"><button class="secondary" onclick="closeEditor()">Cancel</button><button class="primary" onclick="saveEditor()">Save journey</button></div><div id="deleteWrap" class="actions" style="display:none"><button class="danger" onclick="deleteCurrent()">Delete journey</button></div></div></div></div>
<script src="app.js"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
