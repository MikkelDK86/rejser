<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#e9e9ea"><meta name="description" content="A personal archive of the places you have been.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Travel Pokédex">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>Travel Pokédex</title>
<style>
:root{--bg:#e9e9ea;--card:#f6f6f6;--ink:#0b0b0c;--muted:#5b5f64;--line:#d5d5d8;--amb:#f5b301;--shadow:0 10px 30px rgba(0,0,0,.08),0 1px 0 rgba(255,255,255,.9) inset;--font:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.blackCard :focus-visible,.hero :focus-visible,.celebrate :focus-visible,.lightbox :focus-visible,.dcard:focus-visible{outline-color:#fff}
.app{max-width:560px;margin:auto;min-height:100vh;min-height:100dvh;padding-bottom:130px;position:relative;background:var(--bg)}
.view{display:none}.view.active{display:block}
.srOnly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0;min-height:60px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tools{display:flex;gap:8px}
.iconBtn{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
.thumbs{display:flex;align-items:center;min-height:40px}
.thumbs img,.thumbs .more{width:34px;height:34px;border-radius:17px;object-fit:cover;border:2px solid var(--bg);box-sizing:content-box;margin-left:-10px;background:#c9c9cc}
.thumbs>:first-child{margin-left:0}
.thumbs .more{background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;margin:0}
.head{padding:22px 20px 0;display:flex;flex-direction:column;gap:6px}
.head.row2{flex-direction:row;align-items:flex-end;justify-content:space-between}
.head.row2>div:first-child{display:flex;flex-direction:column;gap:6px}
.cap,.capS,.capC,.capL,.capL2,.cap2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.capS{font-size:10px;letter-spacing:.1em}.capC{text-align:center;margin-top:14px}
.capL{font-size:10px;color:#a9adb2}.capL2{color:#d0d3d6}
.num{font-weight:500;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.empty{padding:60px 24px;text-align:center;color:var(--muted);line-height:1.6}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.grow{flex:1;min-width:0}

/* home deck */
.deckWrap{position:relative;height:376px;margin-top:22px;overflow:visible}
.deck{position:relative;width:250px;height:352px;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline-offset:8px}
.dcard{position:absolute;left:0;top:0;width:250px;height:352px;border-radius:22px;overflow:hidden;background:#3a3c40;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .34s;box-shadow:0 14px 28px rgba(0,0,0,.18);cursor:pointer;color:#fff;text-align:left;display:block}
.dcard.front{box-shadow:0 26px 44px rgba(0,0,0,.30)}
.dcard img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.dcard .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.3) 0%,rgba(11,11,12,0) 30%,rgba(11,11,12,.78) 100%)}
.dcard .veil{position:absolute;inset:0;background:#0b0b0c;opacity:0;transition:opacity .34s}
.dcard .no{position:absolute;left:16px;top:16px;padding:5px 10px;border-radius:14px;background:rgba(255,255,255,.22);font-size:11px;font-weight:700;letter-spacing:.1em}
.dcard.up .no{background:var(--amb);color:var(--ink)}
.dcard.up{outline:2px solid var(--amb);outline-offset:-2px}
.dcard .txt{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 14px;text-align:center;transition:opacity .2s}
.dcard:not(.front) .txt,.dcard:not(.front) .no{opacity:0}
.dt{font-weight:300;letter-spacing:.12em;text-transform:uppercase;line-height:1.15}
.rule{display:block;width:72px;height:2px;background:#fff}
.dmeta{font-size:11px;font-weight:500;letter-spacing:.14em}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px;min-height:8px;align-items:center}
.dot{width:6px;height:6px;border-radius:3px;background:#b9b9bd;transition:width .2s}.dot.on{width:22px;background:var(--ink)}
.radar{position:relative;display:block;width:200px;height:200px;margin:8px auto 0}
.radar svg{display:block}
.radarTag{position:absolute;left:50%;top:39px;transform:translateX(-50%);height:24px;padding:0 10px;border-radius:5px;background:var(--amb);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;white-space:nowrap}

/* world */
.globeBox{position:relative;width:324px;height:324px;margin:18px auto 0;filter:drop-shadow(0 14px 22px rgba(0,0,0,.10))}
.globeBox.small{width:300px;height:300px}
.globeBox canvas{display:block;touch-action:none;border-radius:50%;cursor:grab}
.resetBtn{position:absolute;right:-8px;bottom:-4px;width:40px;height:40px;filter:none}
.legend{display:flex;gap:18px;align-items:center;padding:8px 20px 0;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:7px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:6px}.lgv{background:var(--ink)}.lgu{background:var(--amb);box-shadow:0 0 0 1px var(--ink)}
.blackCard{position:relative;background:var(--ink);color:#fff;border-radius:24px;padding:16px 20px;box-shadow:0 16px 30px rgba(0,0,0,.22)}
.nextCard{margin:14px 20px 0;min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.nextCard>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.nextTitle{font-size:24px;font-weight:700;letter-spacing:-.01em}
.bigDays{display:flex;align-items:flex-end;gap:6px}.bigDays .capL{padding-bottom:6px}
.ambDot{position:absolute;right:16px;top:14px;width:9px;height:9px;border-radius:5px;background:var(--amb)}
.ambBtn{width:44px;height:44px;border-radius:22px;background:var(--amb);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.metrics3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:22px 20px 0}
.metrics3>div{display:flex;flex-direction:column;gap:6px}
.metrics3.pad{padding-top:24px}

/* journeys */
.rows{display:flex;flex-direction:column;gap:10px;padding:20px 20px 0}
.jrow{position:relative;min-height:68px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.jrow.sel{background:var(--ink);color:#fff;min-height:78px;box-shadow:0 16px 30px rgba(0,0,0,.22)}
.jrow.sel .capS{color:#a9adb2}.jrow:focus-visible{outline-offset:3px}.jrow.sel:focus-visible{outline-color:#fff}
.jl{display:flex;flex-direction:column;gap:5px;min-width:0}.jt{font-size:16px;font-weight:500;letter-spacing:-.01em}.jrow.sel .jt{font-size:18px;font-weight:700}
.jr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.jrow .ambDot{right:12px;top:10px;width:8px;height:8px}
.pills{display:flex;gap:8px;padding:18px 20px 0;flex-wrap:wrap}
.pill{height:44px;padding:0 18px;border-radius:22px;font-size:13px;font-weight:500;color:var(--muted)}
.pill.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* passport */
.ratio{display:flex;align-items:flex-end;gap:6px}.ratio .cap{padding-bottom:8px}
.stampCard{margin:18px 20px 0;border-radius:28px;background:var(--card);box-shadow:var(--shadow);padding:18px 8px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 2px}
.stampWrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:150px;min-height:130px}
.blotch{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:52px;background:var(--amb)}
.stampWrap svg{position:relative;z-index:1}
.emptySlot{width:130px;height:80px;border:1.5px dashed #b4b6ba;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(3deg);font-size:12px;color:var(--muted)}
.passCard{margin:14px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.passCard>div:first-child{display:flex;flex-direction:column;gap:4px}
.pbar{width:150px;display:flex;flex-direction:column;gap:6px}.pbar .right{text-align:right}
.track{height:8px;border-radius:4px;background:#3a3c40;overflow:hidden}.fill{height:8px;background:var(--amb);border-radius:4px}

/* trip */
.hero{position:relative;height:340px;background:#3a3c40 center/cover no-repeat;color:#fff}
.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,.35) 0%,rgba(11,11,12,0) 28%,rgba(11,11,12,.8) 100%)}
.ghost{position:absolute;top:16px;height:44px;min-width:44px;border-radius:22px;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 12px;z-index:2;backdrop-filter:blur(6px)}
.ghost.edit{padding:0 18px;font-size:14px;font-weight:500}
.heroText{position:absolute;left:20px;right:84px;bottom:22px;display:flex;flex-direction:column;gap:6px;z-index:1}
.cap2{font-size:12px;letter-spacing:.12em;color:#fff;text-transform:uppercase;font-weight:500}
.heroTitle{margin:0;font-size:36px;font-weight:300;letter-spacing:.08em;line-height:1.08;text-transform:uppercase}
.badge{position:absolute;right:20px;bottom:22px;width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;z-index:2}
.tabs2{display:flex;gap:6px;padding:10px 20px 0;overflow-x:auto}
.tabs2 button{height:44px;padding:0 10px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs2 button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--amb)}
.tabBody{padding:18px 20px 0}
.mrow{display:flex;gap:26px;flex-wrap:wrap}.mrow>div{display:flex;flex-direction:column;gap:5px}
.storyTxt{font-size:16px;line-height:1.55;margin:18px 0 0}.storyTxt.center{text-align:center;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chip{font-size:12px;padding:7px 12px;border-radius:99px;background:#fff;box-shadow:var(--shadow)}
.pcard{position:relative;display:block;width:100%;height:96px;border-radius:18px;overflow:hidden;margin-top:12px;box-shadow:0 12px 24px rgba(0,0,0,.16);text-align:left;color:#fff}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scrimD{position:absolute;inset:0;background:rgba(11,11,12,.5)}
.pc{position:absolute;left:18px;bottom:14px;display:flex;flex-direction:column;gap:3px}.pc b{font-size:10px;letter-spacing:.14em;color:#f5c94a}.pc span{font-size:19px;font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{display:block;border-radius:16px;overflow:hidden;background:#c9c9cc;aspect-ratio:1/1;padding:0}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.stampBig{display:flex;justify-content:center;padding:26px 0 6px;background:var(--card);border-radius:28px;box-shadow:var(--shadow)}

/* more */
.mlist{padding:22px 20px 0}
.mcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.mi{font-size:26px;line-height:1}.mcard b{display:block;margin-bottom:3px}.mcard .st{margin-top:8px}
.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}

/* nav pill */
.pillNav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:9;display:flex;gap:6px;padding:6px;border-radius:33px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.16)}
.pillNav button{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pillNav button.on{background:var(--ink);color:#fff}
.pillNav button:focus-visible{outline-offset:1px}

/* buttons + forms */
.primary{width:100%;height:52px;border-radius:26px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.primary[disabled]{opacity:.5;cursor:default}
.secondary{height:46px;padding:0 18px;border-radius:23px;background:#fff;box-shadow:var(--shadow);font-weight:500;font-size:14px}
.danger{height:46px;padding:0 18px;border-radius:23px;background:#f6dcd6;color:#8f2a17;font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(11,11,12,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:var(--bg);width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow:auto;border-radius:28px 28px 0 0;padding:20px}
.sheetHeader{display:flex;justify-content:space-between;align-items:center}.sheetHeader h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
.close{width:44px;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.form{padding:8px 0}.field{margin:14px 0}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:13px 14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.mediaPicker{border:1.5px dashed #b4b6ba;border-radius:18px;padding:16px;background:var(--card);font-size:14px}
.mediaPicker input{margin-top:8px;border:0;padding:0;background:none;width:auto}
.notice{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.draftGrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.draftItem{position:relative;width:76px;height:76px}
.draftItem .draftImg{display:block;width:100%;height:100%;padding:0;border-radius:14px;overflow:hidden;border:2px solid transparent}
.draftItem.cover .draftImg{border-color:var(--amb)}
.draftItem img{width:100%;height:100%;object-fit:cover;display:block}
.draftRm{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;line-height:1}
.coverBadge{position:absolute;left:4px;bottom:4px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;background:var(--amb);color:var(--ink);font-weight:700;border-radius:99px;padding:2px 6px;pointer-events:none}
.formMsg{margin:10px 0 0;font-size:13px;color:#a02d18;min-height:1em}.formMsg.info{color:var(--muted)}
#modalTitle:focus{outline:none}

/* toast */
.toast{position:fixed;z-index:70;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 14px;border-radius:16px;font-size:13px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{color:var(--amb);font-weight:700;min-height:32px}

/* celebration */
.celebrate{position:fixed;inset:0;z-index:50;background:var(--ink);color:#fff;display:none;overflow:auto}.celebrate.show{display:block}
.cRings{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none}
.cIn{position:relative;max-width:420px;margin:0 auto;min-height:100%;padding:56px 28px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cTag{height:26px;padding:0 12px;border-radius:6px;background:var(--amb);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.14em;display:flex;align-items:center}
.cStamp{margin-top:34px;animation:stampIn .7s cubic-bezier(.2,.9,.25,1.1) both}
.cName{margin:24px 0 10px;font-size:30px;font-weight:300;letter-spacing:.14em;text-transform:uppercase}
.cSub{margin-top:12px;font-size:12px;letter-spacing:.14em;color:#d0d3d6}
.cRow{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:34px}
.cNum{display:flex;align-items:flex-end;gap:8px}.cNum .capL{padding-bottom:10px}
.cProg{width:130px;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;text-align:left}
.cBtns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:34px}
.cBtns button{height:54px;border-radius:27px;font-size:16px;font-weight:700}
.cBtns .amb{background:var(--amb);color:var(--ink)}.cBtns .outline{border:1px solid #5d6064;color:#fff;font-weight:500;height:50px}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-28deg);opacity:0}55%{transform:scale(.93) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(0)}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(11,11,12,.95);display:none;align-items:center;justify-content:center;touch-action:pan-y}.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:82vh;max-height:82dvh;object-fit:contain;border-radius:8px}
.lbBtn{position:absolute;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
#lbClose{right:16px;top:16px}#lbPrev{left:12px;top:50%;margin-top:-24px}#lbNext{right:12px;top:50%;margin-top:-24px}
#lbCount{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#d0d3d6;font-size:12px;letter-spacing:.14em}

@media(min-width:700px){body{padding:20px 0}.app{border-radius:32px;overflow:hidden;box-shadow:0 20px 80px #0002;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app" id="app">
<div id="home" class="view active"><div class="empty">Loading…</div></div><div id="world" class="view"></div><div id="trips" class="view"></div><div id="trip" class="view"></div><div id="passport" class="view"></div><div id="more" class="view"></div>

<script>
const APP_VERSION='0.6.0';
const DB_NAME='travelPokedex',LEGACY_KEY='travelPokedexTrips',PLACEHOLDER='assets/placeholder.svg';
const MAX_PHOTOS_PER_TRIP=40;
const $=id=>document.getElementById(id);

/* ---------- Seed data (only used on the very first run) ---------- */
const defaults=[
{id:'vegas',title:'Las Vegas',country:'USA',cities:'Las Vegas, AREA15, Hoover Dam',start:'2026-08-04',end:'2026-08-10',story:'DEF CON med teamet. Teknologi, netværk og lidt for meget Vegas.',photos:['assets/vegas2.svg','assets/vegas.svg'],tags:['DEF CON','AREA15','Hoover Dam']},
{id:'lisbon',title:'Lisbon',country:'Portugal',cities:'Lisbon',start:'2026-11-08',end:'2026-11-13',story:'By, mad og en tur med Sporting i kalenderen.',photos:['assets/lisbon.svg'],tags:['CITY','FOOD']},
{id:'london',title:'London',country:'United Kingdom',cities:'London',start:'2026-11-14',end:'2026-11-16',story:'Weekend i London.',photos:['assets/london.svg'],tags:['CITY']},
{id:'germany',title:'Lübeck & Sierksdorf',country:'Germany',cities:'Lübeck, Sierksdorf',start:'2025-07-01',end:'2025-07-08',story:'Family holiday.',photos:['assets/germany.svg'],tags:['FAMILY']},
{id:'italy',title:'Rome · Florence · Venice',country:'Italy',cities:'Rome, Florence, Venice',start:'2024-06-01',end:'2024-06-10',story:'Historical memory.',photos:['assets/italy.svg'],tags:['MEMORY']}
];
const BUNDLED_ASSET=/^assets\/[\w-]+\.svg$/;

/* ---------- Model helpers ----------
   Runtime trip.photos = [{id, asset, src, thumb}]  (id = stored photo, asset = bundled artwork)
   Stored trip record   photos = [{id}] | [{asset}]  (blobs live in the 'photos' object store) */
let meta={lastBackup:null,lastChange:null,firstChange:null,celebrated:null};
let trips=[],db=null,storageOK=true,editingId=null,draft=[],busy=0,saving=false,lastFocus=null,editSession=0,inAppNav=0;

function normalizeTrip(t){
  const cities=Array.isArray(t.cities)?t.cities.map(String):String(t.cities||'').split(',').map(x=>x.trim()).filter(Boolean);
  const country=String(t.country||(t.locations&&t.locations[0]&&t.locations[0].country)||'Unknown').trim();
  const locations=Array.isArray(t.locations)&&t.locations.length?t.locations:(cities.length?cities.map(city=>({city,country})):[{city:'',country}]);
  return {...t,id:String(t.id),title:String(t.title||'Untitled'),country,cities,locations,start:t.start||'',end:t.end||'',story:t.story||'',photos:Array.isArray(t.photos)?t.photos:[],tags:Array.isArray(t.tags)?t.tags.map(String):[]};
}
function toRecord(t){const {photos,...rest}=t;delete rest.image;return {...rest,photos:photos.map(p=>p.id?{id:p.id}:{asset:p.asset})}}
function hydrate(rec,byId){
  const photos=(rec.photos||[]).map(ref=>{
    if(ref&&ref.asset&&BUNDLED_ASSET.test(ref.asset))return {id:null,asset:ref.asset,src:ref.asset,thumb:ref.asset};
    const p=ref&&byId.get(ref.id);if(!p)return null;
    return {id:p.id,src:URL.createObjectURL(p.blob),thumb:URL.createObjectURL(p.thumb||p.blob)};
  }).filter(Boolean);
  return normalizeTrip({...rec,photos});
}
function revokePhoto(p){if(p&&p.id){URL.revokeObjectURL(p.src);URL.revokeObjectURL(p.thumb)}}
function uid(prefix){return prefix+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('IndexedDB unavailable'));
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('trips',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('meta')};
  r.onsuccess=()=>{r.result.onversionchange=()=>r.result.close();res(r.result)};
  r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('DB blocked'));
})}
const reqP=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const txDone=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Transaction aborted'))});

async function loadMeta(){
  const st=db.transaction('meta','readonly').objectStore('meta');
  const [a,b,c,d]=await Promise.all(['lastBackup','lastChange','firstChange','celebrated'].map(k=>reqP(st.get(k))));
  meta={lastBackup:a||null,lastChange:b||null,firstChange:c||null,celebrated:Array.isArray(d)?d:null};
}
async function setMeta(k,v){if(!db)return;const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put(v,k);await txDone(tx);meta[k]=v}
function stampChange(tx){const now=Date.now(),st=tx.objectStore('meta');st.put(now,'lastChange');if(!meta.firstChange)st.put(now,'firstChange');return now}
function noteChange(now){meta.lastChange=now;if(!meta.firstChange)meta.firstChange=now}
async function markBackedUp(){
  const now=Date.now();
  try{const tx=db.transaction('meta','readwrite');tx.objectStore('meta').put(now,'lastBackup');await txDone(tx);meta.lastBackup=now;renderMore()}catch(e){}
}
function backupStatus(){
  if(!meta.lastBackup)return meta.lastChange?'No backup yet.':'Nothing to back up yet.';
  const d=Math.floor((Date.now()-meta.lastBackup)/864e5),when=d<1?'today':d===1?'yesterday':d+' days ago';
  return 'Last backup: '+when+(meta.lastChange&&meta.lastChange>meta.lastBackup?' – changes since then are not backed up.':'.');
}
const BACKUP_REMINDER_DAYS=14;
function checkBackupReminder(){
  if(!db||!meta.lastChange||(meta.lastBackup&&meta.lastBackup>=meta.lastChange))return; // nothing new to protect
  const base=meta.lastBackup||meta.firstChange||meta.lastChange;
  if(Date.now()-base<BACKUP_REMINDER_DAYS*864e5)return;
  toast('It’s been a while since your last backup.',{label:'Export',ms:10000,action:()=>{showView('more');exportBackup()}});
}

async function readAll(){
  const tx=db.transaction(['trips','photos'],'readonly');
  const [recs,photos]=await Promise.all([reqP(tx.objectStore('trips').getAll()),reqP(tx.objectStore('photos').getAll())]);
  return {recs,photos};
}
async function loadTrips(){
  const {recs,photos}=await readAll();const byId=new Map(photos.map(p=>[p.id,p]));
  return recs.map(r=>hydrate(r,byId));
}
async function commitTrip(trip,addedPhotos,removedIds){
  if(!db)return;
  const tx=db.transaction(['trips','photos','meta'],'readwrite');
  const ps=tx.objectStore('photos');
  addedPhotos.forEach(p=>ps.put({id:p.id,tripId:trip.id,blob:p.blob,thumb:p.thumbBlob}));
  removedIds.forEach(id=>ps.delete(id));
  tx.objectStore('trips').put(toRecord(trip));
  const now=stampChange(tx);
  await txDone(tx);
  noteChange(now);notifyOtherTabs();
}
async function removeTripFromDB(trip){
  if(!db)return;
  const tx=db.transaction(['trips','photos','meta'],'readwrite');
  trip.photos.forEach(p=>p.id&&tx.objectStore('photos').delete(p.id));
  tx.objectStore('trips').delete(trip.id);
  const now=stampChange(tx);
  await txDone(tx);
  noteChange(now);notifyOtherTabs();
}

/* ---------- First run: migrate v0.3/0.4 localStorage data, or seed the demo journeys ---------- */
function dataURLToBlob(u){
  const i=u.indexOf(','),head=u.slice(0,i),mime=(/^data:([^;,]+)/.exec(head)||[])[1]||'image/jpeg';
  const bin=atob(u.slice(i+1)),arr=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
  return new Blob([arr],{type:mime});
}
async function initData(){
  const meta=(mode)=>db.transaction('meta',mode).objectStore('meta');
  if(await reqP(meta('readonly').get('seeded')))return;
  let legacy=null;try{legacy=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null')}catch(e){legacy=null}
  const records=[],photoRows=[];
  if(Array.isArray(legacy)&&legacy.length){
    for(const raw of legacy){
      const t=normalizeTrip(raw);const refs=[];
      let list=(raw.photos||[]).filter(x=>typeof x==='string');
      if(raw.image&&list.includes(raw.image))list=[raw.image,...list.filter(x=>x!==raw.image)];
      for(const src of list){
        if(BUNDLED_ASSET.test(src)){refs.push({asset:src});continue}
        if(!src.startsWith('data:image/'))continue;
        try{const {blob,thumbBlob}=await processImage(dataURLToBlob(src));const id=uid('ph_');photoRows.push({id,tripId:t.id,blob,thumb:thumbBlob});refs.push({id})}catch(e){console.warn('Skipped a photo during migration',e)}
      }
      records.push(toRecord({...t,photos:refs.map(r=>r.id?{id:r.id}:{id:null,asset:r.asset})}));
    }
  }else{
    defaults.forEach(d=>records.push(toRecord(normalizeTrip({...d,photos:d.photos.map(a=>({id:null,asset:a}))}))));
  }
  const tx=db.transaction(['trips','photos','meta'],'readwrite');
  records.forEach(r=>tx.objectStore('trips').put(r));
  photoRows.forEach(p=>tx.objectStore('photos').put(p));
  tx.objectStore('meta').put(true,'seeded');
  if(legacy&&records.length){const now=Date.now();tx.objectStore('meta').put(now,'lastChange');tx.objectStore('meta').put(now,'firstChange')}
  await txDone(tx);
  if(legacy)try{localStorage.removeItem(LEGACY_KEY)}catch(e){}
}

/* ---------- Photos: decode, downscale, thumbnail ---------- */
async function decodeImage(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};i.src=u});
}
const canvasBlob=(c,q)=>new Promise(res=>c.toBlob(res,'image/jpeg',q));
async function processImage(file){
  const img=await decodeImage(file),w=img.width||img.naturalWidth,h=img.height||img.naturalHeight;
  if(!w||!h)throw new Error('empty image');
  const scaled=max=>{const s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c};
  const blob=await canvasBlob(scaled(1600),.82),thumbBlob=await canvasBlob(scaled(480),.75);
  if(img.close)img.close();
  if(!blob||!thumbBlob)throw new Error('encode');
  return {blob,thumbBlob};
}

/* ---------- Countries (table comes from world-data.js) ---------- */
const CBY={};(window.COUNTRIES||[]).forEach(c=>{[c[0],...(c[5]||[])].forEach(n=>{CBY[n.toLowerCase()]=c})});
function countryInfo(name){return CBY[String(name||'').trim().toLowerCase()]||null}
function countryKey(name){const c=countryInfo(name);return c?c[0].toLowerCase():String(name||'').trim().toLowerCase()}
function countryName(name){const c=countryInfo(name);return c?c[0]:String(name||'').trim()}
function countryCode(name){const c=countryInfo(name);return c?c[1]:String(name||'??').replace(/[^A-Za-zÆØÅæøå]/g,'').slice(0,2).toUpperCase()||'??'}

/* ---------- Formatting & stats ---------- */
const todayStr=()=>new Date().toLocaleDateString('sv-SE');
const isUpcoming=t=>!!t.start&&t.start>todayStr();
const visited=()=>trips.filter(t=>!isUpcoming(t));
const pad2=n=>String(n).padStart(2,'0');
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmt(t){if(!t)return 'Dato ikke angivet';const d=new Date(t+'T12:00:00');return d.toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'}).replace('.','')}
function year(t){return t?new Date(t+'T12:00:00').getFullYear():'Ukendt'}
function dm(t){return t?t.slice(8,10)+'.'+t.slice(5,7):'--.--'}
function rangeText(t){
  if(!t.start)return '';if(!t.end||t.end===t.start)return dayMonYear(t.start);
  const a=t.start,b=t.end;
  if(a.slice(0,7)===b.slice(0,7))return a.slice(8,10)+'–'+dayMonYear(b);
  if(a.slice(0,4)===b.slice(0,4))return a.slice(8,10)+' '+MON[+a.slice(5,7)-1]+' – '+dayMonYear(b);
  return dayMonYear(a)+' – '+dayMonYear(b);
}
function monYear(t){return t?MON[+t.slice(5,7)-1]+' '+t.slice(0,4):''}
function dayMonYear(t){return t?t.slice(8,10)+' '+MON[+t.slice(5,7)-1]+' '+t.slice(0,4):''}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uniqBy(list,keyFn){const m=new Map();list.forEach(x=>{const v=String(x||'').trim(),k=keyFn(v);if(v&&!m.has(k))m.set(k,v)});return [...m.values()]}
const uniqCI=list=>uniqBy(list,v=>v.toLowerCase());
const sameCI=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
const cityList=t=>(t.locations||[]).map(x=>x.city).filter(Boolean);
const tripsIn=c=>visited().filter(t=>(t.locations||[]).some(l=>countryKey(l.country)===countryKey(c)));
const countryList=()=>uniqBy(visited().flatMap(t=>(t.locations||[]).map(x=>countryName(x.country))),countryKey);
const allCities=()=>uniqCI(visited().flatMap(cityList));
const photoCount=()=>visited().reduce((n,t)=>n+t.photos.length,0);
const cover=t=>(t.photos[0]&&t.photos[0].src)||PLACEHOLDER;
const coverThumb=t=>(t.photos[0]&&t.photos[0].thumb)||PLACEHOLDER;
const pl=(n,one,many)=>n+' '+(n===1?one:many);
function days(t){if(!t.start||!t.end)return '—';const n=Math.round((new Date(t.end+'T12:00:00')-new Date(t.start+'T12:00:00'))/864e5)+1;return n>=1?n:'—'}
function daysUntil(t){return Math.round((new Date(t.start+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/864e5)}
const byStartDesc=(a,b)=>(b.start||'').localeCompare(a.start||'');
const byStartAsc=(a,b)=>(a.start||'').localeCompare(b.start||'');
const MILESTONES=[5,10,15,20,30,40,50,75,100,150,195];
const nextMilestone=n=>MILESTONES.find(m=>m>n)||195;
function tripNo(t){if(isUpcoming(t))return null;const i=visited().sort(byStartAsc).findIndex(x=>x.id===t.id);return i<0?null:i+1}
function currentTrip(){const td=todayStr();const on=trips.find(t=>t.start&&t.end&&t.start<=td&&td<=t.end);return on||visited().sort(byStartDesc)[0]||null}
function nextTrip(){return trips.filter(isUpcoming).sort(byStartAsc)[0]||null}

/* Passport: one entry per country, numbered by first visit */
function passportEntries(){
  const m=new Map();
  [...trips].sort(byStartAsc).forEach(t=>{
    const up=isUpcoming(t);
    (t.locations||[]).forEach(l=>{
      const k=countryKey(l.country);if(!k)return;
      const e=m.get(k);
      if(!e)m.set(k,{key:k,name:countryName(l.country),trip:t,city:l.city||'',upcoming:up});
      else if(e.upcoming&&!up){e.upcoming=false;e.trip=t;e.city=l.city||e.city}
    });
  });
  const list=[...m.values()];
  return {vis:list.filter(e=>!e.upcoming).map((e,i)=>({...e,no:i+1})),up:list.filter(e=>e.upcoming)};
}

/* ---------- Icons ---------- */
function ico(kind,size=22){
  const p={
    home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
    globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3 3.2 14 0 17M12 3.5c-3.2 3-3.2 14 0 17"/>',
    list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/>',
    passport:'<rect x="5.5" y="3.5" width="13" height="17" rx="2.2"/><circle cx="12" cy="10.5" r="3"/><path d="M8.8 16.5h6.4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M15 6l-6 6 6 6"/>',chev:'<path d="M9 6l6 6-6 6"/>',
    more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
    close:'<path d="M6 6l12 12M18 6L6 18"/>',reset:'<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4.5h4.5"/>'
  }[kind];
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ---------- Stamps (one per country, shape and tilt derived from the name) ---------- */
function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
const SF="font-family=\"'Space Grotesk',system-ui,sans-serif\"";
function stampSvg(e,opts={}){
  const {dashed=false,big=false,color='#0b0b0c',id='s'+e.key.replace(/[^a-z0-9]/g,'')}=opts;
  const h=hashStr(e.key),shape=h%3,rot=opts.rot!==undefined?opts.rot:((h>>3)%15)-7;
  const name=e.name.toUpperCase(),date=e.trip?dayMonYear(e.trip.start):'',city=(e.city||'').toUpperCase(),no=e.no?'Nº '+String(e.no).padStart(3,'0'):'RESERVED';

/* ---------- Globe (canvas, drag to rotate) ---------- */
const WD=window.WORLD||{tags:[],dots:[]};
const GN=WD.dots.length/3;
const globeState={lon0:-45,lat0:35,centered:false};
function projectPt(lon,lat,lon0,lat0){
  const l=(lon-lon0)*Math.PI/180,p=lat*Math.PI/180,p0=lat0*Math.PI/180;
  return {x:Math.cos(p)*Math.sin(l),y:-(Math.cos(p0)*Math.sin(p)-Math.sin(p0)*Math.cos(p)*Math.cos(l)),c:Math.sin(p0)*Math.sin(p)+Math.cos(p0)*Math.cos(p)*Math.cos(l)};
}
function angDist(lat1,lon1,lat2,lon2){
  const a=lat1*Math.PI/180,b=lat2*Math.PI/180,dl=(lon2-lon1)*Math.PI/180;
  return Math.acos(Math.min(1,Math.max(-1,Math.sin(a)*Math.sin(b)+Math.cos(a)*Math.cos(b)*Math.cos(dl))))*180/Math.PI;
}
/* class per land dot: 0 none, 1 visited, 2 upcoming */
function classifyDots(){
  const cls=new Uint8Array(GN),pe=passportEntries(),tagOf=WD.tags;
  const mark=(e,val)=>{
    const c=countryInfo(e.name);if(!c)return;
    const ti=tagOf.indexOf(c[1])+1;
    for(let i=0;i<GN;i++){
      if(cls[i]===1)continue;
      const lon=WD.dots[i*3]/10,lat=WD.dots[i*3+1]/10,tag=WD.dots[i*3+2];
      const hit=ti>0?tag===ti:angDist(lat,lon,c[2],c[3])<=c[4];
      if(hit&&(val===1||cls[i]===0))cls[i]=val;
    }
  };
  pe.up.forEach(e=>mark(e,2));pe.vis.forEach(e=>mark(e,1));
  return cls;
}
function globePoints(){
  const pe=passportEntries();
  const pts=(list,kind)=>list.map(e=>{const c=countryInfo(e.name);return c?{lat:c[2],lon:c[3],kind,name:e.name}:null}).filter(Boolean);
  return {vis:pts(pe.vis,'v'),up:pts(pe.up,'u')};
}
function drawGlobe(cv,st,cls,pts,route){
  const dpr=window.devicePixelRatio||1,S=cv._size,ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
  const R=S/2-6,cx=S/2,cy=S/2,lon0=st.lon0,lat0=st.lat0,k=R/170;
  ctx.beginPath();ctx.arc(cx,cy,R+1,0,7);ctx.fillStyle='#f6f6f7';ctx.fill();ctx.strokeStyle='#d5d5d8';ctx.lineWidth=1.2;ctx.stroke();
  for(let i=0;i<GN;i++){
    const p=projectPt(WD.dots[i*3]/10,WD.dots[i*3+1]/10,lon0,lat0);
    if(p.c<0.06)continue;
    const r=Math.max(.55,1.75*Math.sqrt(p.c))*k,c=cls[i];
    ctx.beginPath();ctx.arc(cx+p.x*R,cy+p.y*R,c===1?r*1.35:c===2?r*1.2:r,0,7);
    ctx.fillStyle=c===1?'#0b0b0c':c===2?'#f5b301':'rgba(86,90,95,.62)';ctx.fill();
  }
  const pos=(lat,lon)=>{const p=projectPt(lon,lat,lon0,lat0);return p.c>0.05?{x:cx+p.x*R,y:cy+p.y*R}:null};
  if(route){const a=pos(route[0].lat,route[0].lon),b=pos(route[1].lat,route[1].lon);
    if(a&&b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2,Math.min(a.y,b.y)-70*k,b.x,b.y);ctx.strokeStyle='#f5b301';ctx.lineWidth=2.4;ctx.lineCap='round';ctx.setLineDash([1,6]);ctx.stroke();ctx.setLineDash([])}}
  pts.vis.forEach(p=>{const q=pos(p.lat,p.lon);if(!q)return;
    ctx.beginPath();ctx.arc(q.x,q.y,8*k,0,7);ctx.strokeStyle='#0b0b0c';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(q.x,q.y,4*k,0,7);ctx.fillStyle='#0b0b0c';ctx.fill();ctx.strokeStyle='#f6f6f7';ctx.lineWidth=1.5;ctx.stroke()});
  pts.up.forEach((p,i)=>{const q=pos(p.lat,p.lon);if(!q)return;
    ctx.beginPath();ctx.arc(q.x,q.y,(i===0?9:6)*k,0,7);ctx.fillStyle='#f5b301';ctx.fill();ctx.strokeStyle='#f6f6f7';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(q.x,q.y,3*k,0,7);ctx.fillStyle='#0b0b0c';ctx.fill()});
}
function midpoint(a,b){
  const r=Math.PI/180,x=Math.cos(a.lat*r)*Math.cos(a.lon*r)+Math.cos(b.lat*r)*Math.cos(b.lon*r),y=Math.cos(a.lat*r)*Math.sin(a.lon*r)+Math.cos(b.lat*r)*Math.sin(b.lon*r),z=Math.sin(a.lat*r)+Math.sin(b.lat*r);

function mountGlobe(cv,opts={}){
  if(!cv)return;
  const S=+cv.dataset.size||324,dpr=window.devicePixelRatio||1;cv._size=S;cv.width=S*dpr;cv.height=S*dpr;cv.style.width=S+'px';cv.style.height=S+'px';

  else if(!st.centered){const m=route?midpoint(last,nx):last?{lat:last.lat,lon:last.lon}:null;if(m){st.lon0=m.lon;st.lat0=Math.max(15,Math.min(55,m.lat))}st.centered=true}
  const redraw=()=>drawGlobe(cv,st,cls,pts,opts.noRoute?null:route);
  redraw();cv._redraw=redraw;
  let down=null,raf=0;
  const sched=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;redraw()})};
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!down)return;st.lon0-=(e.clientX-down.x)*.45;st.lat0=Math.max(-80,Math.min(80,st.lat0+(e.clientY-down.y)*.35));down={x:e.clientX,y:e.clientY};sched()});
  const up=()=>{down=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('keydown',e=>{const d={ArrowLeft:[-12,0],ArrowRight:[12,0],ArrowUp:[0,8],ArrowDown:[0,-8]}[e.key];if(d){e.preventDefault();st.lon0+=d[0];st.lat0=Math.max(-80,Math.min(80,st.lat0+d[1]));sched()}});
}
function recenterGlobe(){globeState.centered=false;renderWorld()}

  const trip=normalizeTrip({id:editingId||'trip_'+Date.now(),title,country,cities,locations:cities.length?cities.map(city=>({city,country})):[{city:'',country}],start,end,story:$('fStory').value.trim(),tags:old?old.tags:['NEW'],photos:draft.map(({id,asset,src,thumb})=>({id,asset,src,thumb}))});

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function exportBackup(){
  if(!db){toast('Storage is unavailable – nothing to export.');return}

    toast('Preparing backup…',{sticky:true});
    const {recs,photos}=await readAll();
    const out={app:'travel-pokedex',version:1,exportedAt:new Date().toISOString(),trips:recs,photos:[]};
    for(const p of photos)out.photos.push({id:p.id,tripId:p.tripId,blob:await blobToDataURL(p.blob),thumb:await blobToDataURL(p.thumb||p.blob)});
    const name=`travel-pokedex-backup-${todayStr()}.json`,blob=new Blob([JSON.stringify(out)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
    $('toast').classList.remove('show');
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Travel Pokédex backup'});await markBackedUp();return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    await markBackedUp();toast('Backup saved to your downloads.');
  }catch(err){console.error(err);toast('Couldn’t create the backup.')}
}
$('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];e.target.value='';if(!file)return;
  if(!db){toast('Storage is unavailable – can’t import.');return}
  try{
    const data=JSON.parse(await file.text());
    if(!data||data.app!=='travel-pokedex'||!Array.isArray(data.trips)||!Array.isArray(data.photos))throw new Error('Not a Travel Pokédex backup');
    const okId=s=>typeof s==='string'&&/^[\w-]{1,80}$/.test(s);
    const rows=data.photos.filter(p=>okId(p.id)&&/^data:image\//.test(p.blob||'')).map(p=>({id:p.id,tripId:String(p.tripId||''),blob:dataURLToBlob(p.blob),thumb:dataURLToBlob(/^data:image\//.test(p.thumb||'')?p.thumb:p.blob)}));
    const recs=data.trips.filter(t=>t&&okId(t.id)).map(t=>toRecord(normalizeTrip({...t,photos:(Array.isArray(t.photos)?t.photos:[]).map(r=>r&&r.asset?{id:null,asset:r.asset}:{id:r&&r.id})})));
    if(!recs.length)throw new Error('No journeys found in this file');
    if(!confirm(`Import ${recs.length} journey${recs.length>1?'s':''} from this backup?\nJourneys that already exist here will be replaced by the backup version.`))return;
    const tx=db.transaction(['trips','photos','meta'],'readwrite');
    recs.forEach(r=>tx.objectStore('trips').put(r));rows.forEach(p=>tx.objectStore('photos').put(p));
    const now=stampChange(tx);
    await txDone(tx);noteChange(now);
    await refreshFromDB();notifyOtherTabs();
    const keys=passportEntries().vis.map(x=>x.key);await setMeta('celebrated',[...new Set([...(meta.celebrated||[]),...keys])]); // imported history isn't "new"
    toast('Backup imported.');
  }catch(err){console.error(err);toast('That file couldn’t be imported.')}

  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadController||reloading)return;reloading=true;location.reload()});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>toast('A new version is available.',{label:'Reload',sticky:true,action:()=>w.postMessage('SKIP_WAITING')});
    if(reg.waiting&&navigator.serviceWorker.controller)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)offer(w)})});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden){reg.update().catch(()=>{});checkCelebrations()}});
  }).catch(e=>console.warn('Service worker registration failed',e)));
}else document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkCelebrations()});

/* ---------- Boot ---------- */
(function fillCountryList(){const dl=$('countryList');if(dl)dl.innerHTML=(window.COUNTRIES||[]).map(c=>`<option value="${esc(c[0])}"></option>`).join('')})();
(async function boot(){
  if(history.state&&history.state.modal)history.replaceState(null,''); // reloaded while the editor was open
  try{
    db=await openDB();await initData();await loadMeta();trips=await loadTrips();
  }catch(err){
    console.error('Storage failed, running in memory only',err);
    db=null;storageOK=false;
    trips=defaults.map(d=>normalizeTrip({...d,photos:d.photos.map(a=>({id:null,asset:a,src:a,thumb:a}))}));
  }
  renderAll();
  route();
  checkBackupReminder();
  checkCelebrations();
})();
</script></body></html>
